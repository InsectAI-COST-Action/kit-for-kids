; Feasibility spike for docs/adr/0002-on-device-ant-edge-model.md.
; Step 1: does `framework = arduino, espidf` even build for our exact board?
; This is deliberately separate from the main firmware's platformio.ini -
; not meant to be merged until this question (and ESP-DL on top of it) is
; answered. See spikes/edge-ant-model/README.md.
[env:xiao_esp32s3]
platform = espressif32 @ 7.0.1
board = seeed_xiao_esp32s3
framework = arduino, espidf
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200

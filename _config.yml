# GitHub Pages configuration for the InsectAI kit-for-kids site.
#
# Two design notes:
#
# 1. All navigation lives here rather than in YAML front matter inside the
#    Markdown files. GitHub renders front matter as a table when you browse a
#    .md file on github.com, so embedding it would clutter every document for
#    anyone reading the repository directly.
#
# 2. Pages are pinned with explicit `permalink` values. Relying on
#    jekyll-readme-index to place nested README pages put them one directory
#    level too high, so their locations are stated outright instead.

title: InsectAI kit-for-kids
description: An open, DIY insect-camera kit helping children aged 8-12 explore insects, ecology, and computer vision.

# Pinned deliberately: v0.10.x is the Just the Docs line compatible with the
# Jekyll 3.9 build GitHub Pages uses for branch-based publishing.
remote_theme: just-the-docs/just-the-docs@v0.10.2

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links      # turns [foo](foo.md) cross-links into working site links
  - jekyll-optional-front-matter
  - jekyll-readme-index        # makes the root README the site index
  - jekyll-titles-from-headings
  - jekyll-default-layout
  - jekyll-seo-tag
  - jekyll-sitemap

relative_links:
  enabled: true
  collections: false

readme_index:
  enabled: true
  remove_originals: true
  with_frontmatter: true

# Theme behaviour
search_enabled: true
search:
  heading_level: 2
  previews: 2
heading_anchors: true
color_scheme: light

aux_links:
  "View on GitHub":
    - "https://github.com/InsectAI-COST-Action/kit-for-kids"
aux_links_new_tab: true

back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  Part of the <a href="https://www.cost.eu/actions/CA22129/">InsectAI COST Action</a>.
  Released under the MIT Licence.

# Source code, vendored runtimes, datasets and large model assets are browsed
# on GitHub rather than published as site pages.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .pio/
  - software/TomA-insect-ESP32-software/src/
  - software/TomA-insect-ESP32-software/include/
  - software/TomA-insect-ESP32-software/tools/
  - software/TomA-insect-ESP32-software/tests/
  - software/TomA-insect-ESP32-software/dashboard/
  - software/TomA-insect-ESP32-software/datasets/
  - software/TomA-insect-ESP32-software/platformio.ini
  - software/TomA-insect-ESP32-software/partitions.csv
  - software/TomA-insect-ESP32-software/config.example.json
  # Spike write-ups keep their README (documentation links to them) but not
  # their vendored runtimes and model assets, which are tens of megabytes.
  - software/TomA-insect-ESP32-software/spikes/flatbug-browser/vendor/
  - software/TomA-insect-ESP32-software/spikes/flatbug-browser/assets/

defaults:
  # ---- Site-wide -----------------------------------------------------------
  - scope:
      path: ""
    values:
      layout: default

  # ---- Top-level navigation ------------------------------------------------
  - scope:
      path: "README.md"
    values:
      title: "Home"
      nav_order: 1

  - scope:
      path: "software/TomA-insect-ESP32-software/README.md"
    values:
      title: "Camera software"
      permalink: /camera-software/
      nav_order: 2
      has_children: true

  - scope:
      path: "models/README.md"
    values:
      title: "Detection models"
      permalink: /models/
      nav_order: 3

  # ---- Camera-software documents -------------------------------------------
  # Everything under docs/ belongs to the Camera software section. Only the
  # documents useful to someone outside day-to-day development appear in the
  # navigation; the rest stay published (documents cross-link to them) but are
  # kept out of the nav tree by the `nav_exclude` entries further down.
  - scope:
      path: "software/TomA-insect-ESP32-software/docs"
    values:
      parent: "Camera software"

  - scope:
      path: "software/TomA-insect-ESP32-software/docs/setup-guide.md"
    values:
      title: "Setup guide"
      permalink: /camera-software/setup-guide/
      nav_order: 1
  - scope:
      path: "software/TomA-insect-ESP32-software/docs/operations.md"
    values:
      title: "Operations guide"
      permalink: /camera-software/operations/
      nav_order: 2
  - scope:
      path: "software/TomA-insect-ESP32-software/docs/camera-spec.md"
    values:
      title: "Camera specification"
      permalink: /camera-software/camera-specification/
      nav_order: 3
  - scope:
      path: "software/TomA-insect-ESP32-software/docs/architecture.md"
    values:
      title: "Architecture"
      permalink: /camera-software/architecture/
      nav_order: 4
  - scope:
      path: "software/TomA-insect-ESP32-software/docs/data-schema.md"
    values:
      title: "Data schema"
      permalink: /camera-software/data-schema/
      nav_order: 5
  - scope:
      path: "software/TomA-insect-ESP32-software/docs/model-card.md"
    values:
      title: "Model card"
      permalink: /camera-software/model-card/
      nav_order: 6

  # ---- Working documents: published, but not in the navigation -------------
  # These are development records rather than material for people building or
  # using a camera. They remain reachable so that links from the documents
  # above continue to resolve.
  - scope:
      path: "software/TomA-insect-ESP32-software/docs/README.md"
    values:
      title: "Documentation map"
      permalink: /camera-software/notes/documentation-map/
      nav_exclude: true
  - scope:
      path: "software/TomA-insect-ESP32-software/docs/project-brief.md"
    values:
      title: "Project brief"
      permalink: /camera-software/notes/project-brief/
      nav_exclude: true
  - scope:
      path: "software/TomA-insect-ESP32-software/docs/device-control-app-plan.md"
    values:
      title: "Device control app plan"
      permalink: /camera-software/notes/device-control-app-plan/
      nav_exclude: true
  - scope:
      path: "software/TomA-insect-ESP32-software/docs/adr/0001-device-hosted-control-app.md"
    values:
      title: "ADR 0001: Device-hosted control app"
      permalink: /camera-software/notes/adr-0001-device-hosted-control-app/
      nav_exclude: true
  - scope:
      path: "software/TomA-insect-ESP32-software/docs/browser-inference-plan.md"
    values:
      title: "Browser inference plan"
      permalink: /camera-software/notes/browser-inference-plan/
      nav_exclude: true
  - scope:
      path: "software/TomA-insect-ESP32-software/docs/hardware-validation.md"
    values:
      title: "Hardware validation"
      permalink: /camera-software/notes/hardware-validation/
      nav_exclude: true
  - scope:
      path: "software/TomA-insect-ESP32-software/docs/camera-quality-trial.md"
    values:
      title: "Camera quality trial"
      permalink: /camera-software/notes/camera-quality-trial/
      nav_exclude: true
  - scope:
      path: "software/TomA-insect-ESP32-software/docs/performance-experiment.md"
    values:
      title: "Performance experiment"
      permalink: /camera-software/notes/performance-experiment/
      nav_exclude: true
  - scope:
      path: "software/TomA-insect-ESP32-software/docs/reconciliation-policy.md"
    values:
      title: "Reconciliation policy"
      permalink: /camera-software/notes/reconciliation-policy/
      nav_exclude: true
  - scope:
      path: "software/TomA-insect-ESP32-software/docs/next-session.md"
    values:
      title: "Next session checklist"
      permalink: /camera-software/notes/next-session/
      nav_exclude: true

  # Spike write-ups: reachable, but out of the navigation tree.
  - scope:
      path: "software/TomA-insect-ESP32-software/spikes"
    values:
      nav_exclude: true
